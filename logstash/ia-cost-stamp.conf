# -----------------------------------------------------------------------------
# ia-cost-stamp.conf: stage 2b of the ETL. Once a day, after ia-cost-daily.conf,
# stamps cost.* onto every mapped ia-workqueue-items document in the lookback
# (and any mapped item with no stamp yet): its worktime times the day's hub and
# own-spoke cost per bot-second, read from the ia-cost-daily docs.
#
# Settings, as environment variables (defaults after the colon):
#   IA_COST_STAMP_SCHEDULE  "0 2 * * * UTC"   cron; 30 minutes after the pools
#   IA_COST_LOOKBACK_DAYS   14                same variable as ia-cost-daily.conf
#   IA_ES_API_KEY           (required)
#
# The pool rates come from filter-elasticsearch, one lookup per pool per item
# (two small searches against ia-cost-daily, which holds a few thousand docs).
# Two lookups of one result each, not one of two: with result_size 2 the values
# come back as arrays whose order is not guaranteed, and as a scalar when only
# one pool is found. An item whose pool docs are missing is skipped and retried
# on the next run. logstash-filter-elasticsearch ships with Logstash.
# Placeholders in <> need your values.
# -----------------------------------------------------------------------------
input {
  elasticsearch {
    hosts    => ["<https://your-cluster:9200>"]
    api_key  => "${IA_ES_API_KEY}"
    index    => "ia-workqueue-items"
    schedule => "${IA_COST_STAMP_SCHEDULE:0 2 * * * UTC}"
    size     => 1000
    scroll   => "10m"
    docinfo  => false
    # Only what the stamp needs, and only whole past days (before today, UTC): an
    # item is never stamped against a partial day's worktime.
    query    => '{
      "_source": ["item.id", "outcome_date", "worktime_sec", "mapped", "spoke.name"],
      "query": { "bool": {
        "filter": [ { "term": { "mapped": true } }, { "range": { "outcome_date": { "lt": "now/d" } } } ],
        "should": [
          { "range": { "outcome_date": { "gte": "now-${IA_COST_LOOKBACK_DAYS:14}d/d" } } },
          { "bool": { "must_not": { "exists": { "field": "cost.stamped_at" } } } }
        ],
        "minimum_should_match": 1
      } }
    }'
  }
}

filter {
  elasticsearch {
    hosts          => ["<https://your-cluster:9200>"]
    api_key        => "${IA_ES_API_KEY}"
    index          => "ia-cost-daily"
    query          => 'date:"%{[outcome_date]}" AND pool:"HUB"'
    fields         => {
      "people_gbp"   => "[@metadata][hub_people]"
      "infra_gbp"    => "[@metadata][hub_infra]"
      "worktime_sec" => "[@metadata][hub_wt]"
    }
    tag_on_failure => ["_ia_hub_pool_lookup_failed"]
  }
  elasticsearch {
    hosts          => ["<https://your-cluster:9200>"]
    api_key        => "${IA_ES_API_KEY}"
    index          => "ia-cost-daily"
    query          => 'date:"%{[outcome_date]}" AND pool_type:spoke AND pool:"%{[spoke][name]}"'
    fields         => {
      "people_gbp"   => "[@metadata][spoke_people]"
      "infra_gbp"    => "[@metadata][spoke_infra]"
      "worktime_sec" => "[@metadata][spoke_wt]"
    }
    tag_on_failure => ["_ia_spoke_pool_lookup_failed"]
  }
  ruby {
    path          => "/etc/logstash/ia/ia-cost.rb"
    script_params => { "mode" => "stamp" }
  }
}

# The event now holds only cost (and the @timestamp Logstash adds, which is not
# written). A scripted update sets cost alone, so it cannot race the Part 2
# pass over any other field. No upsert: an item deleted since it was read stays
# deleted. "event" is the plugin's default script_var_name; the script reads it
# as params.event.
output {
  elasticsearch {
    hosts             => ["<https://your-cluster:9200>"]
    api_key           => "${IA_ES_API_KEY}"
    index             => "ia-workqueue-items"
    document_id       => "%{[@metadata][doc_id]}"
    action            => "update"
    script            => "ctx._source.cost = params.event.get('cost')"
    script_type       => "inline"
    script_lang       => "painless"
    script_var_name   => "event"
    retry_on_conflict => 3
    manage_template   => false
  }
}
