# -----------------------------------------------------------------------------
# ia-cost-daily.conf: stage 2a of the ETL. Once a day it totals worktime per
# day (estate-wide and per spoke) from ia-workqueue-items, works out each day's
# cost pools in ia-cost.rb, and writes ia-cost-daily (one doc per pool per day)
# and ia-vdi-daily (one doc per VDI per day). Re-running is harmless: the _ids
# are date|pool and date|resource, so a day is rewritten, never duplicated.
#
# Run ia-cost-stamp.conf after this one (it reads what this writes).
#
# Settings, as environment variables (defaults after the colon):
#   IA_COST_SCHEDULE        "30 1 * * * UTC"  cron; this is 01:30 UTC daily
#   IA_COST_LOOKBACK_DAYS   14                whole days rewritten, ending yesterday UTC
#   IA_ES_API_KEY           (required)        see docs/JOBS.md for privileges
# Backfill: set IA_COST_LOOKBACK_DAYS=730 (for two years), see docs/JOBS.md.
#
# Needs a logstash-input-elasticsearch that supports response_type (check the
# plugin docs for your Logstash). Otherwise use the http_poller input at the
# foot of this file instead.
# Placeholders in <> need your values.
# -----------------------------------------------------------------------------
input {
  elasticsearch {
    hosts         => ["<https://your-cluster:9200>"]
    api_key       => "${IA_ES_API_KEY}"
    index         => "ia-workqueue-items"
    schedule      => "${IA_COST_SCHEDULE:30 1 * * * UTC}"
    response_type => "aggregations"
    size          => 0
    # size 0: aggregations only. Whole past days only: from N days ago up to, not
    # including, today (UTC), matching the days the filter emits.
    # Every item counts, mapped or not, as the estate denominator needs.
    query         => '{
      "size": 0,
      "query": { "range": { "outcome_date": { "gte": "now-${IA_COST_LOOKBACK_DAYS:14}d/d", "lt": "now/d" } } },
      "aggs": { "by_day": {
        "date_histogram": { "field": "outcome_date", "calendar_interval": "day", "format": "yyyy-MM-dd" },
        "aggs": {
          "w":  { "sum": { "field": "worktime_sec" } },
          "sp": { "terms": { "field": "spoke.name", "size": 100 }, "aggs": { "w": { "sum": { "field": "worktime_sec" } } } }
        }
      } }
    }'
  }
}

filter {
  ruby {
    path          => "/etc/logstash/ia/ia-cost.rb"
    script_params => {
      "mode"           => "pools"
      "reference_path" => "/etc/logstash/ia/reference.json"
      "reload_seconds" => 300
      "lookback_days"  => "${IA_COST_LOOKBACK_DAYS:14}"
    }
  }
  # @version is in no ia-* template (all are strict).
  mutate { remove_field => ["@version"] }
}

output {
  elasticsearch {
    hosts           => ["<https://your-cluster:9200>"]
    api_key         => "${IA_ES_API_KEY}"
    index           => "%{[@metadata][index]}"
    document_id     => "%{[@metadata][doc_id]}"
    action          => "index"
    manage_template => false
  }
}

