# -----------------------------------------------------------------------------
# ia-workqueue.conf: stage 1 of the ETL. Reads Blue Prism work-queue items
# from wherever they already land in Elastic, enriches each one
# (ia-enrich.rb) and upserts it into ia-workqueue-items keyed by item ID, so a
# later state (loaded -> completed) replaces the earlier one.
#
# Placeholders in <> need your values. See docs/LOGSTASH.md.
# -----------------------------------------------------------------------------
input {
  elasticsearch {
    hosts       => ["<https://your-cluster:9200>"]
    api_key     => "${IA_ES_API_KEY}"
    index       => "<your-blue-prism-workqueue-index>"
    # Incremental: everything touched in the last 2 days, every 15 minutes.
    # Re-processing an item is harmless (same _id, same result).
    query       => '{ "query": { "range": { "<LastUpdatedDate field>": { "gte": "now-2d" } } } }'
    schedule    => "*/15 * * * *"
    size        => 1000
    scroll      => "5m"
    docinfo     => false
  }
}

filter {
  ruby {
    path          => "/etc/logstash/ia/ia-enrich.rb"
    script_params => { "reference_path" => "/etc/logstash/ia/reference.json" "reload_seconds" => 300 }
  }
}

output {
  elasticsearch {
    hosts       => ["<https://your-cluster:9200>"]
    api_key     => "${IA_ES_API_KEY}"
    index       => "ia-workqueue-items"
    document_id => "%{[@metadata][doc_id]}"
    action      => "index"
    manage_template => false
  }
}
