r add</tspan><tspan x="0" dy="15">capacity.</tspan><tspan x="0" dy="15"/></text></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g><g transform="translate(16,134)"><path class="background" aria-hidden="true" d="M0,0h863v84h-863Z"/><g><g class="mark-rule role-mark" role="graphics-symbol" aria-roledescription="rule mark container"><line transform="translate(0,87)" x2="863" y2="0" stroke="#D6D9D2"/></g><g class="mark-rect role-mark" role="graphics-symbol" aria-roledescription="rect mark container"><path d="M9,1L85,1C89.967235220446,1,94,5.032764779554,94,10L94,10C94,14.967235220446,89.967235220446,19,85,19L9,19C4.032764779554,19,0,14.967235220446,0,10L0,10C0,5.032764779554,4.032764779554,1,9,1Z" fill="#F5EAD6"/></g><g class="mark-symbol role-mark" role="graphics-symbol" aria-roledescription="symbol mark container"><path transform="translate(10,10)" d="M2.345,0A2.345,2.345,0,1,1,-2.345,0A2.345,2.345,0,1,1,2.345,0" fill="#B9852C"/></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(18,13)" font-family="'JetBrains Mono', Consolas, 'Roboto Mono', monospace" font-size="9.5px" font-weight="600" fill="#B9852C">WARNING</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(106,15)" font-family="Fraunces, Cambria, Georgia, Gelasio, serif" font-size="15px" font-weight="600" fill="#0F4D43">System exceptions normal</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="end" transform="translate(863,14)" font-family="Inter, 'Segoe UI', Carlito, Calibri, Arial, sans-serif" font-size="12px" fill="#5F6E69">1 process above usual</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(0,38)" font-family="Inter, 'Segoe UI', Carlito, Calibri, Arial, sans-serif" font-size="12px" fill="#0F4D43">Insurance New Business: 6 system exceptions (12.0% vs usual 3.7%)</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(0,57)" font-family="Inter, 'Segoe UI', Carlito, Calibri, Arial, sans-serif" font-size="11.5px" fill="#5F6E69"><tspan>First step: Read the top reason for the process. It is usually a target system outage, a credential change or a screen change; pause the schedule</tspan><tspan x="0" dy="15">if items are failing in bulk.</tspan><tspan x="0" dy="15"/></text></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>