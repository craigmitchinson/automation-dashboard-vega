<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" class="marks" width="895" height="382" viewBox="0 0 895 382"><rect width="895" height="382" fill="#FFFFFF"/><g fill="none" stroke-miterlimit="10" transform="translate(0,0)"><g class="mark-group role-frame root" role="graphics-object" aria-roledescription="group mark container"><g transform="translate(0,0)"><path class="background" aria-hidden="true" d="M0,0h895v382h-895Z"/><g><g class="mark-text role-mark frame_title" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(16,27)" font-family="'JetBrains Mono', Consolas, 'Roboto Mono', monospace" font-size="11px" font-weight="600" fill="#0F4D43">WHAT TO DO NOW</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(122.60000000000001,26)" font-family="Inter, 'Segoe UI', Carlito, Calibri, Arial, sans-serif" font-size="12px" fill="#5F6E69">Checks that aren't OK, most urgent first, with the first step</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="middle" transform="translate(447.5,208)" font-family="Inter, 'Segoe UI', Carlito, Calibri, Arial, sans-serif" font-size="13px" fill="#0B8A6B" opacity="0">Nothing needs action. Kibana will alert the team if that changes.</text></g><g class="mark-group role-scope" role="graphics-object" aria-roledescription="group mark container"><g transform="translate(16,42)"><path class="background" aria-hidden="true" d="M0,0h863v84h-863Z"/><g><g class="mark-rule role-mark" role="graphics-symbol" aria-roledescription="rule mark container"><line transform="translate(0,87)" x2="863" y2="0" stroke="#D6D9D2"/></g><g class="mark-rect role-mark" role="graphics-symbol" aria-roledescription="rect mark container"><path d="M9,1L85,1C89.967235220446,1,94,5.032764779554,94,10L94