 UI', system-ui, -apple-system, sans-serif" font-size="20px" font-weight="600" fill="#5F6E69" opacity="0">–</text></g><g class="mark-text role-mark" role="graphics-object" aria-roledescription="text mark container"><text text-anchor="start" transform="translate(16,112)" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5px" fill="#5F6E69">No estate target is set yet, so attainment is hidden across the dashboards: add financeTargets to reference.json. Projected ≈£300.1k by year end at the year-to-date rate. Year to date is £86.4k ahead of the prior year at the same point.</text></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>